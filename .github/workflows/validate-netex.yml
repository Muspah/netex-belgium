name: Validate NeTEx (Belgium)

on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [netex-sync-complete]

concurrency:
  group: netex-validate
  cancel-in-progress: true

env:
  NETWORK_OFFER_URL: https://data.gtfs.be/belgium/netex/schedule/netex-be-network-offer.xml.gz
  NETEX_SCHEMA_REF: v1.3.1       # pin — don't float on master
  EPIP_SCHEMA_REF: master        # EPIP repo has no tags; pin a commit SHA once reviewed

jobs:
  validate-no-constraint:
    name: Validate (no constraint)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Log trigger source
        run: echo "Triggered by ${{ github.event.client_payload.triggered_by || github.event_name }}"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Compile XSD validator
        run: javac -d build scripts/XsdValidate.java

      - name: Download NeTEx network offer export
        run: curl -fL -o netex.xml.gz "$NETWORK_OFFER_URL"

      - name: Unpack data
        run: |
          mkdir -p data
          gunzip -c netex.xml.gz > data/netex-be-network-offer.xml
          echo "Network offer files:"; find data -name '*.xml'

      - name: Cache NeTEx XSDs
        id: cache-xsd
        uses: actions/cache@v4
        with:
          path: schemas
          key: netex-xsd-${{ env.NETEX_SCHEMA_REF }}-epip-${{ env.EPIP_SCHEMA_REF }}

      - name: Download XSDs
        if: steps.cache-xsd.outputs.cache-hit != 'true'
        run: |
          mkdir -p schemas
          curl -fL -o netex.tar.gz \
            "https://github.com/TransmodelEcosystem/NeTEx/archive/refs/tags/${NETEX_SCHEMA_REF}.tar.gz"
          tar xzf netex.tar.gz -C schemas --strip-components=1

          curl -fL -o epip.tar.gz \
            "https://github.com/TransmodelEcosystem/NeTEx-Profile-EPIP/archive/${EPIP_SCHEMA_REF}.tar.gz"
          mkdir -p schemas/epip
          tar xzf epip.tar.gz -C schemas/epip --strip-components=1

      - name: Validate network offer against generic EPIP (structural only)
        run: |
          java -Xmx4g -cp build XsdValidate schemas/epip/NeTEx_publication_EPIP-NoConstraint.xsd $(find data -name '*.xml') 2>&1 | tee validation.log
          exit ${PIPESTATUS[0]}

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: netex-validation-logs-no-constraint
          path: validation.log

  validate-with-constraint:
    name: Validate (with constraint)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: false  # disabled: constraint validation runs too long, GitHub kills the job — re-enable once it's faster
    steps:
      - name: Log trigger source
        run: echo "Triggered by ${{ github.event.client_payload.triggered_by || github.event_name }}"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Compile XSD validator
        run: javac -d build scripts/XsdValidate.java

      - name: Download NeTEx network offer export
        run: curl -fL -o netex.xml.gz "$NETWORK_OFFER_URL"

      - name: Unpack data
        run: |
          mkdir -p data
          gunzip -c netex.xml.gz > data/netex-be-network-offer.xml
          echo "Network offer files:"; find data -name '*.xml'

      - name: Cache NeTEx XSDs
        id: cache-xsd
        uses: actions/cache@v4
        with:
          path: schemas
          key: netex-xsd-${{ env.NETEX_SCHEMA_REF }}-epip-${{ env.EPIP_SCHEMA_REF }}

      - name: Download XSDs
        if: steps.cache-xsd.outputs.cache-hit != 'true'
        run: |
          mkdir -p schemas
          curl -fL -o netex.tar.gz \
            "https://github.com/TransmodelEcosystem/NeTEx/archive/refs/tags/${NETEX_SCHEMA_REF}.tar.gz"
          tar xzf netex.tar.gz -C schemas --strip-components=1

          curl -fL -o epip.tar.gz \
            "https://github.com/TransmodelEcosystem/NeTEx-Profile-EPIP/archive/${EPIP_SCHEMA_REF}.tar.gz"
          mkdir -p schemas/epip
          tar xzf epip.tar.gz -C schemas/epip --strip-components=1

      - name: Validate network offer against generic EPIP (with constraints)
        run: |
          java -Xmx4g -cp build XsdValidate schemas/epip/NeTEx_publication_EPIP.xsd $(find data -name '*.xml') 2>&1 | tee validation.log
          exit ${PIPESTATUS[0]}

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: netex-validation-logs-with-constraint
          path: validation.log
